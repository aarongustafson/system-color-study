name: Add a system color snapshot
description: Contribute a snapshot from your browser and settings.
title: "[Snapshot]: "
labels: ["color-snapshot"]
body:
  - type: markdown
    attributes:
      value: |
        Capture your browser at https://aarongustafson.github.io/system-color-study/test.html.
        Submit only default browser and OS color schemes, including built-in light, dark, and contrast themes with their colors unchanged. Custom user-defined palettes are outside this study's scope.
        Your functional colors are your choice, along with their consequences; this study makes no judgment about what works for you.
        We support using system colors, especially in @media (forced-colors: active) queries. The study examines how browsers apply named colors in different contexts and where some pairings fall short, not whether people should use them.
        Download the JSON for your own copy, then use Copy JSON on the current test page and paste it below.
        Copy JSON provides the same observations as the download, without formatting, to fit the field limit. Both contain both schemes and all 42 keywords, not calculated contrast reports or grades.
        Validation checks the data format, not whether the observed colors pass contrast thresholds.
        The workflow validates one snapshot. After the owner comments /approve-snapshot, it revalidates the data and opens a data-only pull request for review.
        Do not include personal information or credentials.
  - type: textarea
    id: snapshot
    attributes:
      label: Snapshot data
      description: Paste the complete compact JSON from Copy JSON, not the downloaded file (20,000-character limit). Do not add Markdown fences yourself.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Confirmation
      options:
        - label: I checked the browser and OS versions, removed “verify” placeholders, and reviewed the data for personal information.
          required: true
